services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mentor-app
    container_name: mentor_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - mentor_net
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: mentor_nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mentor_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.mentor-http.rule=Host(`mentor.aligm.cloud`)"
      - "traefik.http.routers.mentor-http.entrypoints=http"
      - "traefik.http.routers.mentor-http.middlewares=mentor-redirect"
      - "traefik.http.routers.mentor.rule=Host(`mentor.aligm.cloud`)"
      - "traefik.http.routers.mentor.entrypoints=https"
      - "traefik.http.routers.mentor.tls=true"
      - "traefik.http.routers.mentor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mentor.service=mentor"
      - "traefik.http.middlewares.mentor-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.mentor-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.mentor.loadbalancer.server.port=80"

  db:
    image: mysql:8.0
    container_name: mentor_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mentor}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - mentor_net

networks:
  mentor_net:
    driver: bridge
  coolify:
    external: true

volumes:
  dbdata:
    external: true
    name: mentor_dbdata
